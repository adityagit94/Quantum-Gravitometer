# Keep GitHub Actions and Python dependencies current via weekly PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # qgrav pins only lower bounds; this mainly surfaces new major releases
    # of the test/lint toolchain referenced in pyproject.toml.
    open-pull-requests-limit: 5
